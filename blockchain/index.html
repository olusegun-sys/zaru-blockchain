<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ZARU Wallet</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:#0a0e1a;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;color:#fff}
        .container{background:#1a1f35;border-radius:20px;padding:30px;max-width:500px;width:100%;border:1px solid rgba(100,200,255,0.1)}
        h1{text-align:center;font-size:28px;margin-bottom:20px;color:#fff}
        h1 span{color:#4fc3f7}
        .addr{background:rgba(0,0,0,0.3);border-radius:12px;padding:15px;margin-bottom:20px}
        .addr label{font-size:11px;color:#888}
        .addr display{display:flex;gap:10px;align-items:center;word-break:break-all;color:#4fc3f7;font-family:monospace}
        .balance{text-align:center;padding:20px;background:rgba(79,195,247,0.08);border-radius:12px;margin-bottom:20px}
        .balance .amt{font-size:44px;font-weight:bold}
        .balance .amt span{font-size:22px;color:#4fc3f7}
        .btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
        .btn-primary{background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#fff}
        .btn-success{background:linear-gradient(135deg,#66bb6a,#43a047);color:#fff}
        .send{background:rgba(0,0,0,0.2);border-radius:12px;padding:18px;margin-top:18px}
        .send input{width:100%;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);background:rgba(0,0,0,0.3);color:#fff;margin:5px 0 12px}
        .tx{display:flex;justify-content:space-between;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;margin-bottom:6px;font-size:13px}
        .sent{color:#ef5350}.received{color:#66bb6a}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.95);padding:12px 24px;border-radius:10px;display:none;z-index:999}
        .toast.show{display:block}.toast.success{border:1px solid #4caf50}.toast.error{border:1px solid #f44336}
        .debug{margin-top:15px;padding:10px;background:rgba(0,0,0,0.3);border-radius:8px;font-size:11px;color:#666}
    </style>
</head>
<body>
<div class="container">
    <h1>ZARU <span>Wallet</span></h1>
    <div style="text-align:center;font-size:14px;color:#888;margin-bottom:20px">Digital money for the real world</div>

    <div class="addr">
        <label>Your Address</label>
        <div style="display:flex;gap:10px;align-items:center">
            <code id="addressDisplay" style="color:#4fc3f7;background:rgba(79,195,247,0.08);padding:8px 12px;border-radius:8px;flex:1;font-family:monospace;font-size:13px">Loading...</code>
            <button onclick="copyAddress()" style="background:rgba(79,195,247,0.12);border:none;color:#4fc3f7;padding:8px 12px;border-radius:8px;cursor:pointer">📋</button>
            <button onclick="createAddress()" style="background:rgba(79,195,247,0.12);border:none;color:#4fc3f7;padding:8px 12px;border-radius:8px;cursor:pointer">➕</button>
        </div>
    </div>

    <div class="balance">
        <div class="amt" id="balanceDisplay">0 <span>ZARU</span></div>
        <div style="font-size:13px;color:#888">Available Balance</div>
        <div style="display:flex;justify-content:center;gap:30px;margin-top:8px;font-size:13px;color:#666">
            <span>Pending: <strong id="pendingBalance" style="color:#e0e0e0">0</strong></span>
            <span>Total: <strong id="totalBalance" style="color:#e0e0e0">0</strong></span>
        </div>
    </div>

    <button class="btn btn-primary" onclick="refresh()">🔄 Refresh</button>

    <div class="send">
        <h3 style="font-size:15px;margin-bottom:12px">💸 Send ZARU</h3>
        <label style="font-size:12px;color:#888">Recipient Address</label>
        <input type="text" id="sendTo" placeholder="Enter address...">
        <label style="font-size:12px;color:#888">Amount (ZARU)</label>
        <input type="number" id="sendAmount" placeholder="0.00" step="0.00000001" min="0">
        <button class="btn btn-success" onclick="send()">Send ZARU</button>
    </div>

    <div style="margin-top:18px;border-top:1px solid rgba(255,255,255,0.05);padding-top:18px">
        <h3 style="font-size:15px;margin-bottom:12px">📜 Transactions</h3>
        <div id="transactionHistory"><div style="color:#444;text-align:center;padding:20px">No transactions yet</div></div>
    </div>

    <div class="debug">
        API: <span id="debugApi">https://zaru-api.onrender.com</span><br>
        Status: <span id="debugStatus">Loading...</span>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'https://zaru-api.onrender.com';
let currentAddress = '', addresses = [], balance = 0, pending = 0;

function toast(msg, type='info'){
    const el=document.getElementById('toast');
    el.textContent=msg;
    el.className='toast show '+type;
    clearTimeout(el._t);
    el._t=setTimeout(()=>el.classList.remove('show'),4000);
}

async function call(endpoint,method='GET',body=null){
    const opts={method,headers:{'Content-Type':'application/json'}};
    if(body) opts.body=JSON.stringify(body);
    const res=await fetch(API+endpoint,opts);
    if(!res.ok){const err=await res.json().catch(()=>({}));throw new Error(err.detail||err.message||'HTTP '+res.status);}
    return res.json();
}

async function load(){
    try{
        await call('/health');
        const data=await call('/wallet/addresses');
        addresses=data.addresses||[];
        if(addresses.length===0){await createAddress();return;}
        currentAddress=addresses[0];
        document.getElementById('addressDisplay').textContent=currentAddress;
        await refreshBalance();
        await refreshTxs();
        document.getElementById('debugStatus').textContent='✅ Connected';
        document.getElementById('debugStatus').style.color='#4caf50';
    }catch(e){
        document.getElementById('debugStatus').textContent='❌ '+e.message;
        document.getElementById('debugStatus').style.color='#f44336';
        toast('Error: '+e.message,'error');
    }
}

async function refresh(){toast('Refreshing...','info');await load();toast('✅ Refreshed!','success');}
async function createAddress(){
    try{
        const data=await call('/wallet/address','POST',{label:'Wallet '+(addresses.length+1)});
        if(data.address){
            addresses.push(data.address);
            currentAddress=data.address;
            document.getElementById('addressDisplay').textContent=currentAddress;
            await refreshBalance();
            await refreshTxs();
            toast('✅ New address created!','success');
        }
    }catch(e){toast('❌ Failed: '+e.message,'error');}
}
async function refreshBalance(){
    if(!currentAddress)return;
    try{
        const data=await call('/wallet/balance/'+currentAddress);
        balance=data.confirmed||0;
        pending=data.pending||0;
        updateBalance();
    }catch(e){console.error(e);}
}
function updateBalance(){
    const b=(balance/100000000).toFixed(8);
    const p=(pending/100000000).toFixed(8);
    const t=((balance+pending)/100000000).toFixed(8);
    document.getElementById('balanceDisplay').innerHTML=b+' <span>ZARU</span>';
    document.getElementById('pendingBalance').textContent=p;
    document.getElementById('totalBalance').textContent=t;
}
async function refreshTxs(){
    if(!currentAddress)return;
    try{
        const data=await call('/wallet/transactions/'+currentAddress+'?limit=20');
        renderTxs(data.transactions||[]);
    }catch(e){document.getElementById('transactionHistory').innerHTML='<div style="color:#444;text-align:center;padding:20px">No transactions yet</div>';}
}
function renderTxs(txs){
    const container=document.getElementById('transactionHistory');
    if(!txs||txs.length===0){container.innerHTML='<div style="color:#444;text-align:center;padding:20px">No transactions yet</div>';return;}
    let html='';
    txs.slice(0,10).forEach(tx=>{
        const amt=((tx.amount||0)/100000000).toFixed(8);
        const type=tx.type==='sent'?'sent':'received';
        const label=tx.type==='sent'?'⬆ Sent':'⬇ Received';
        html+='<div class="tx"><div><span class="'+type+'">'+label+'</span><div style="color:#555;font-size:11px;font-family:monospace">'+(tx.tx_id?tx.tx_id.slice(0,16)+'...':'Unknown')+'</div></div><span class="'+type+'">'+amt+' ZARU</span></div>';
    });
    container.innerHTML=html;
}
function copyAddress(){
    if(!currentAddress){toast('No address to copy','error');return;}
    navigator.clipboard.writeText(currentAddress).then(()=>toast('✅ Address copied!','success'))
    .catch(()=>{const inp=document.createElement('input');inp.value=currentAddress;document.body.appendChild(inp);inp.select();document.execCommand('copy');document.body.removeChild(inp);toast('✅ Address copied!','success');});
}
async function send(){
    const to=document.getElementById('sendTo').value.trim();
    const amtInput=document.getElementById('sendAmount').value;
    if(!to){toast('Enter recipient address','error');return;}
    if(!amtInput||parseFloat(amtInput)<=0){toast('Enter valid amount','error');return;}
    const amtZARU=parseFloat(amtInput);
    const amtSat=Math.floor(amtZARU*100000000);
    if(amtSat>balance){toast('Insufficient balance','error');return;}
    try{
        const data=await call('/wallet/send','POST',{to_address:to,amount:amtSat,from_address:currentAddress,fee:0});
        if(data.success){
            toast('✅ Sent '+amtZARU+' ZARU!','success');
            document.getElementById('sendTo').value='';
            document.getElementById('sendAmount').value='';
            await refreshBalance();
            await refreshTxs();
        }else{toast('❌ Failed: '+data.message,'error');}
    }catch(e){toast('❌ Error: '+e.message,'error');}
}
document.addEventListener('DOMContentLoaded',()=>{document.getElementById('debugApi').textContent=API;load();});
console.log('🔐 ZARU Wallet loaded');
console.log('📡 API:',API);
</script>
</body>
</html>
